<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — ČB Routes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 100px; text-align: center;">
    <h2>Admin Login</h2>
    <input type="password" id="secretToken" placeholder="Enter Admin Secret Token" style="width: 100%; padding: 10px; margin-bottom: 15px;">
    <button id="loginBtn" class="btn">Login</button>
  </div>
  
  <script>
    document.getElementById('loginBtn').addEventListener('click', () => {
      const token = document.getElementById('secretToken').value;
      if (token) {
        localStorage.setItem('adminToken', token);
        window.location.href = 'admin.html';
      }
    });
  </script>
</body>
</html>
